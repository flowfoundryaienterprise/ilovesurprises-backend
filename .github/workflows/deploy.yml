name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            git config --global --add safe.directory "*" || true
            echo "=== Listing /var/www ==="
            ls -la /var/www

            echo "=== Deploying Backend commit 5e41958 ==="
            cd /var/www/ilovesurprises-backend
            git fetch origin
            git checkout Feat/Backend || git checkout -b Feat/Backend origin/Feat/Backend
            git reset --hard 5e41958

            git show 51230de:.env > .env
            sed -i 's/NODE_ENV=development/NODE_ENV=production/' .env
            echo "STRIPE_SECRET_KEY=sk_test_ilovesurprises_placeholder_secret_key" >> .env
            echo "STRIPE_WEBHOOK_SECRET=whsec_placeholder_secret_key" >> .env
            echo "FRONTEND_URL=https://ilovesurprises.com" >> .env
            git show 30ba198:ecosystem.config.js > ecosystem.config.js

            echo "Backend verified commit: $(git log -1 --oneline)"
            npm ci
            npx prisma generate
            npm run build

            echo "Restarting PM2 backend service..."
            pm2 delete all || true
            pm2 start ecosystem.config.js
            pm2 save || true
            sleep 3
            pm2 status
            echo "=== PM2 recent logs ==="
            pm2 logs ilovesurprises-api --lines 30 --nostream || true

            echo "=== Local health check on VPS ==="
            curl -s http://localhost:3000/health || true

            echo "=== Recording VPS Diagnostic Information ==="
            cd /var/www/ilovesurprises-backend
            echo "=== NGINX CONFIG ===" > vps-info.txt
            cat /etc/nginx/sites-enabled/* >> vps-info.txt 2>&1 || true
            echo "=== /VAR/WWW LISTING ===" >> vps-info.txt
            ls -la /var/www >> vps-info.txt
            for d in /var/www/*; do
              if [ -d "$d/.git" ]; then
                echo "=== REPO: $d ===" >> vps-info.txt
                cd "$d"
                git remote -v >> /var/www/ilovesurprises-backend/vps-info.txt
                git log -1 --oneline >> /var/www/ilovesurprises-backend/vps-info.txt
              fi
            done
            cd /var/www/ilovesurprises-backend
            git checkout -B vps-diagnostics
            git add vps-info.txt
            git commit -m "chore: vps diagnostic info" || true
            git push origin vps-diagnostics -f || true
            git checkout Feat/Backend || true

            echo "=== Updating Active Frontend on VPS ==="
            for FE_DIR in /var/www/Ilovesurprises-frontend /var/www/Ilovesuprises-frontend /var/www/ilovesurprises-frontend; do
              if [ -d "$FE_DIR/.git" ]; then
                echo "Deploying real frontend at $FE_DIR"
                cd "$FE_DIR"
                git fetch origin
                git checkout main || git checkout -b main origin/main
                git reset --hard origin/main
                echo "Frontend at: $(git log -1 --oneline)"
                npm ci
                npm run build
                if [ -d "/var/www/html" ]; then
                  echo "Syncing built dist to /var/www/html..."
                  rm -rf /var/www/html/* || true
                  cp -r dist/* /var/www/html/ || true
                fi
              fi
            done

            sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload 2>/dev/null || true
            echo "Deployment finished successfully!"