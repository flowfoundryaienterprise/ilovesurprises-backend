name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            git config --global --add safe.directory "*" || true
            echo "=== Listing /var/www ==="
            ls -la /var/www

            echo "=== Deploying Backend commit 5e41958 ==="
            cd /var/www/ilovesurprises-backend
            git fetch origin
            git checkout Feat/Backend || git checkout -b Feat/Backend origin/Feat/Backend
            git reset --hard 5e41958

            git show 51230de:.env > .env
            sed -i 's/NODE_ENV=development/NODE_ENV=production/' .env
            echo "STRIPE_SECRET_KEY=sk_test_ilovesurprises_placeholder_secret_key" >> .env
            echo "STRIPE_WEBHOOK_SECRET=whsec_placeholder_secret_key" >> .env
            echo "FRONTEND_URL=https://ilovesurprises.com" >> .env
            git show 30ba198:ecosystem.config.js > ecosystem.config.js

            echo "Backend verified commit: $(git log -1 --oneline)"
            npm ci
            npx prisma generate
            npm run build

            echo "Restarting PM2 backend service..."
            pm2 delete all || true
            pm2 start ecosystem.config.js
            pm2 save || true
            sleep 3
            pm2 status
            echo "=== PM2 recent logs ==="
            pm2 logs ilovesurprises-api --lines 30 --nostream || true

            echo "=== Local health check on VPS ==="
            curl -s http://localhost:3000/health || true

            echo "=== Deploying Active Frontend (efe9e26) ==="
            for FE_DIR in /var/www/ilovesurprises-platform /var/www/Ilovesurprises-frontend /var/www/ilovesurprises-frontend; do
              if [ -d "$FE_DIR" ]; then
                echo "Configuring $FE_DIR to point to Ilovesurprises-frontend..."
                cd "$FE_DIR"
                git remote set-url origin https://github.com/flowfoundryaienterprise/Ilovesurprises-frontend.git || true
                git fetch origin
                git checkout -B main origin/main
                git reset --hard origin/main
                echo "Frontend at: $(git log -1 --oneline)"
                npm ci || npm install
                npm run build
                echo "Build completed in $FE_DIR"
                if [ -d "/var/www/html" ] && [ "$FE_DIR" != "/var/www/html" ]; then
                  echo "Copying dist to /var/www/html..."
                  cp -r dist/* /var/www/html/ 2>/dev/null || true
                fi
              fi
            done

            sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload 2>/dev/null || true
            echo "Deployment finished successfully!"