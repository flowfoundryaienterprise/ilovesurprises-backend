name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            git config --global --add safe.directory "*" || true
            echo "=== Listing /var/www ==="
            ls -la /var/www
            echo "=== Deploying Backend commit 5e41958 ==="
            cd /var/www/ilovesurprises-backend
            git fetch origin
            git checkout Feat/Backend || git checkout -b Feat/Backend origin/Feat/Backend
            git reset --hard 5e41958
            git show origin/main:ecosystem.config.js > ecosystem.config.js
            echo "Backend checked out at: $(git log -1 --oneline)"
            npm ci
            npx prisma generate
            npm run build
            pm2 reload ecosystem.config.js --update-env || pm2 restart ilovesurprises-api || pm2 start ecosystem.config.js
            pm2 status
            echo "=== Deploying Frontend ==="
            for DIR in /var/www/*; do
              if [ -d "$DIR/.git" ] && [ "$DIR" != "/var/www/ilovesurprises-backend" ]; then
                echo "Updating frontend repository at $DIR"
                cd "$DIR"
                git fetch origin
                (git checkout main && git reset --hard origin/main) || true
                echo "Frontend at: $(git log -1 --oneline)"
                npm ci
                npm run build
                if [ -d "/var/www/html" ] && [ "$DIR" != "/var/www/html" ]; then
                  echo "Copying dist to /var/www/html..."
                  cp -ru dist/* /var/www/html/ 2>/dev/null || true
                fi
              fi
            done
            sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload 2>/dev/null || true
            echo "Deployment finished successfully!"